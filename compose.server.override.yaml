# Override file for agentops-api:
#  - Pin image to the patched Workday + CC Switch enrollment + RAG v2 +
#    AI chat monitoring build.
#  - Inject LLM env vars at runtime (no secrets in this file).
#  - Add local BGE-M3 embedding and BGE reranker services for staged RAG v2.
#  - Restore uvicorn startup (base image's CMD was overwritten by a botched
#    `docker commit`; the patch Dockerfile fixes the entrypoint instead).
#
# After any backend code change, rebuild with:
#   docker build -f Dockerfile.api-workday \
#     -t agentops-api-local:smartbrain-portable-2026-08-13 .
#
# Setup (PowerShell, in a fresh session):
#   $env:ANTHROPIC_AUTH_TOKEN = "your-gateway-token"
#   $env:ANTHROPIC_DOCKER_BASE_URL = "http://host.docker.internal:9000"
#   $env:RAG_LLM_MODEL = "claude-sonnet-4-6-20250514"
#   docker compose -f compose.server.yaml -f compose.server.override.yaml up -d api
#
# On this GTX 1080 server, include the GPU override when recreating the RAG
# model services so embedding/reranker stay on CUDA:
#   docker compose -f compose.server.yaml -f compose.server.override.yaml -f compose.rag-gpu.override.yaml \
#     up -d rag-embedding-service rag-reranker-service
#
# Verify:
#   curl http://<server-ip>:8000/health              -> 200
#   curl -X POST http://<server-ip>:8000/v4/knowledge/answer \
#     -H "Content-Type: application/json" \
#     -d '{"project_id":"<uuid>","query":"<text>","k":3}'
#   Look for "source": "llm" in the response.

services:
  rag-embedding-service:
    image: rag-embedding-service-local:latest
    build:
      context: .
      dockerfile: rag_services/embedding_service/Dockerfile
    restart: unless-stopped
    environment:
      HF_HOME: /models/huggingface
      RAG_EMBED_MODEL_NAME: ${RAG_EMBED_MODEL_NAME:-BAAI/bge-m3}
      RAG_EMBED_BATCH_SIZE: ${RAG_EMBED_BATCH_SIZE:-4}
      RAG_EMBED_MAX_LENGTH: ${RAG_EMBED_MAX_LENGTH:-8192}
      RAG_EMBED_USE_FP16: ${RAG_EMBED_USE_FP16:-false}
      RAG_MODEL_DEVICE: ${RAG_MODEL_DEVICE:-auto}
    volumes:
      - rag_model_cache:/models

  rag-reranker-service:
    image: rag-reranker-service-local:latest
    build:
      context: .
      dockerfile: rag_services/reranker_service/Dockerfile
    restart: unless-stopped
    environment:
      HF_HOME: /models/huggingface
      RAG_RERANK_MODEL_NAME: ${RAG_RERANK_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      RAG_RERANK_BATCH_SIZE: ${RAG_RERANK_BATCH_SIZE:-2}
      RAG_RERANK_MAX_LENGTH: ${RAG_RERANK_MAX_LENGTH:-1024}
      RAG_RERANK_USE_FP16: ${RAG_RERANK_USE_FP16:-false}
      RAG_MODEL_DEVICE: ${RAG_MODEL_DEVICE:-auto}
    volumes:
      - rag_model_cache:/models

  api:
    image: agentops-api-local:smartbrain-portable-2026-08-13
    depends_on:
      - clickhouse
    environment:
      PROTOCOL: ${PROTOCOL:-http}
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      WORKDAY_COLLECTOR_ENDPOINT: ${WORKDAY_COLLECTOR_ENDPOINT}
      WIKI_MCP_TOKEN_SECRET: ${WIKI_MCP_TOKEN_SECRET:-}
      # Read token from host shell env. NEVER hardcode secrets in this file.
      # The local gateway performs upstream authentication.
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-local-proxy}
      # Containers must reach the host-side gateway via host.docker.internal,
      # NOT 127.0.0.1 (which would resolve to the container itself). Use a
      # Docker-specific override to avoid inheriting host CLI settings.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_DOCKER_BASE_URL:-http://host.docker.internal:9000}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-claude-opus-4-8-20250514}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-claude-sonnet-4-6-20250514}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-claude-haiku-4-5-20251001}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-claude-sonnet-4-6-20250514}
      PROJECT_MEMORY_MODEL: ${PROJECT_MEMORY_MODEL:-claude-sonnet-4-6-20250514}
      AI_USAGE_REPORT_MODEL: ${AI_USAGE_REPORT_MODEL:-claude-sonnet-4-6-20250514}
      RAG_RETRIEVAL_VERSION: ${RAG_RETRIEVAL_VERSION:-v1}
      RAG_EMBEDDING_SERVICE_URL: ${RAG_EMBEDDING_SERVICE_URL:-http://rag-embedding-service:8080}
      RAG_RERANKER_SERVICE_URL: ${RAG_RERANKER_SERVICE_URL:-http://rag-reranker-service:8080}
      RAG_V2_EMBEDDING_MODEL: ${RAG_V2_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_V2_EMBEDDING_VERSION: ${RAG_V2_EMBEDDING_VERSION:-2026-07-21-bge-m3}
      RAG_V2_EMBED_ON_UPLOAD: ${RAG_V2_EMBED_ON_UPLOAD:-false}
      RAG_V2_FALLBACK_TO_V1: ${RAG_V2_FALLBACK_TO_V1:-true}
      PROJECT_WIKI_MODEL: ${PROJECT_WIKI_MODEL:-claude-sonnet-4-6-20250514}
      PROJECT_WIKI_MAX_TOKENS: ${PROJECT_WIKI_MAX_TOKENS:-8000}
      PROJECT_WIKI_SOURCE_LIMIT_PER_TYPE: ${PROJECT_WIKI_SOURCE_LIMIT_PER_TYPE:-10}
      PROJECT_WIKI_INCLUDE_AI_CHAT_SOURCES: ${PROJECT_WIKI_INCLUDE_AI_CHAT_SOURCES:-false}
      MATERIAL_UPLOAD_STORAGE_DIR: /var/lib/agentops/material-uploads
    volumes:
      - material_uploads:/var/lib/agentops/material-uploads

  project-wiki-worker:
    image: agentops-api-local:smartbrain-portable-2026-08-13
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "agentops.project_wiki.worker"]
    networks:
      - default
      - supabase
    environment:
      SUPABASE_URL: "http://supabase_kong_database:8000"
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_HOST: "supabase_db_database"
      SUPABASE_PORT: "5432"
      SUPABASE_DATABASE: "postgres"
      SUPABASE_USER: "postgres"
      SUPABASE_PASSWORD: "postgres"
      SUPABASE_SSLMODE: "disable"
      SUPABASE_MAX_POOL_SIZE: "10"
      LOGGING_LEVEL: "INFO"
      SQLALCHEMY_LOG_LEVEL: "WARNING"
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-local-proxy}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_DOCKER_BASE_URL:-http://host.docker.internal:9000}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-claude-opus-4-8-20250514}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-claude-sonnet-4-6-20250514}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-claude-haiku-4-5-20251001}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-claude-sonnet-4-6-20250514}
      RAG_RETRIEVAL_VERSION: ${RAG_RETRIEVAL_VERSION:-v1}
      RAG_EMBEDDING_SERVICE_URL: ${RAG_EMBEDDING_SERVICE_URL:-http://rag-embedding-service:8080}
      RAG_RERANKER_SERVICE_URL: ${RAG_RERANKER_SERVICE_URL:-http://rag-reranker-service:8080}
      RAG_V2_EMBEDDING_MODEL: ${RAG_V2_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_V2_EMBEDDING_VERSION: ${RAG_V2_EMBEDDING_VERSION:-2026-07-21-bge-m3}
      RAG_V2_EMBED_ON_UPLOAD: ${RAG_V2_EMBED_ON_UPLOAD:-false}
      RAG_V2_FALLBACK_TO_V1: ${RAG_V2_FALLBACK_TO_V1:-true}
      PROJECT_WIKI_MODEL: ${PROJECT_WIKI_MODEL:-claude-sonnet-4-6-20250514}
      PROJECT_WIKI_MAX_TOKENS: ${PROJECT_WIKI_MAX_TOKENS:-8000}
      PROJECT_WIKI_SOURCE_LIMIT_PER_TYPE: ${PROJECT_WIKI_SOURCE_LIMIT_PER_TYPE:-10}
      PROJECT_WIKI_INCLUDE_AI_CHAT_SOURCES: ${PROJECT_WIKI_INCLUDE_AI_CHAT_SOURCES:-false}
      PROJECT_WIKI_INITIAL_DELAY_SECONDS: ${PROJECT_WIKI_INITIAL_DELAY_SECONDS:-86400}
      PROJECT_WIKI_INTERVAL_SECONDS: ${PROJECT_WIKI_INTERVAL_SECONDS:-86400}

  ai-worklog-worker:
    image: agentops-api-local:smartbrain-portable-2026-08-13
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "agentops.ai_usage.daily_log_worker"]
    networks:
      - default
      - supabase
    environment:
      SUPABASE_URL: "http://supabase_kong_database:8000"
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_HOST: "supabase_db_database"
      SUPABASE_PORT: "5432"
      SUPABASE_DATABASE: "postgres"
      SUPABASE_USER: "postgres"
      SUPABASE_PASSWORD: "postgres"
      SUPABASE_SSLMODE: "disable"
      SUPABASE_MAX_POOL_SIZE: "10"
      LOGGING_LEVEL: "INFO"
      SQLALCHEMY_LOG_LEVEL: "WARNING"
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-local-proxy}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_DOCKER_BASE_URL:-http://host.docker.internal:9000}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-claude-sonnet-4-6-20250514}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-claude-sonnet-4-6-20250514}
      AI_WORKLOG_MODEL: ${AI_WORKLOG_MODEL:-claude-sonnet-4-6-20250514}
      AI_WORKLOG_MAX_TOKENS: ${AI_WORKLOG_MAX_TOKENS:-800}
      AI_WORKLOG_RUN_HOUR: ${AI_WORKLOG_RUN_HOUR:-20}
      AI_WORKLOG_RUN_MINUTE: ${AI_WORKLOG_RUN_MINUTE:-0}
      AI_WORKLOG_RETRY_SECONDS: ${AI_WORKLOG_RETRY_SECONDS:-900}

  member-wiki-worker:
    image: agentops-api-local:smartbrain-portable-2026-08-13
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "agentops.member_wiki.worker"]
    networks:
      - default
      - supabase
    environment:
      SUPABASE_URL: "http://supabase_kong_database:8000"
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_HOST: "supabase_db_database"
      SUPABASE_PORT: "5432"
      SUPABASE_DATABASE: "postgres"
      SUPABASE_USER: "postgres"
      SUPABASE_PASSWORD: "postgres"
      SUPABASE_SSLMODE: "disable"
      SUPABASE_MAX_POOL_SIZE: "10"
      LOGGING_LEVEL: "INFO"
      SQLALCHEMY_LOG_LEVEL: "WARNING"
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-local-proxy}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_DOCKER_BASE_URL:-http://host.docker.internal:9000}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-claude-sonnet-4-6-20250514}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-claude-sonnet-4-6-20250514}
      MEMBER_WIKI_MODEL: ${MEMBER_WIKI_MODEL:-claude-sonnet-4-6-20250514}
      MEMBER_WIKI_MAX_TOKENS: ${MEMBER_WIKI_MAX_TOKENS:-2400}
      MEMBER_WIKI_RUN_HOUR: ${MEMBER_WIKI_RUN_HOUR:-21}
      MEMBER_WIKI_RUN_MINUTE: ${MEMBER_WIKI_RUN_MINUTE:-0}
      MEMBER_WIKI_RETRY_SECONDS: ${MEMBER_WIKI_RETRY_SECONDS:-900}
      MEMBER_WIKI_SESSION_LIMIT: ${MEMBER_WIKI_SESSION_LIMIT:-500}
      RAG_EMBEDDING_SERVICE_URL: ${RAG_EMBEDDING_SERVICE_URL:-http://rag-embedding-service:8080}
      RAG_V2_EMBEDDING_MODEL: ${RAG_V2_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_V2_EMBEDDING_VERSION: ${RAG_V2_EMBEDDING_VERSION:-2026-07-21-bge-m3}

  wiki-mcp:
    image: smartbrain-wiki-mcp-local:latest
    build:
      context: .
      dockerfile: Dockerfile.wiki-mcp
    restart: unless-stopped
    depends_on:
      - rag-embedding-service
      - rag-reranker-service
    ports:
      - "8010:8010"
    networks:
      - default
      - supabase
    environment:
      SUPABASE_HOST: "supabase_db_database"
      SUPABASE_PORT: "5432"
      SUPABASE_DATABASE: "postgres"
      SUPABASE_USER: "postgres"
      SUPABASE_PASSWORD: "postgres"
      SUPABASE_SSLMODE: "disable"
      SUPABASE_MAX_POOL_SIZE: "10"
      API_DOMAIN: ${API_DOMAIN}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET}
      WIKI_MCP_TOKEN_SECRET: ${WIKI_MCP_TOKEN_SECRET:-}
      WIKI_MCP_PUBLIC_URL: ${WIKI_MCP_PUBLIC_URL}
      WIKI_MCP_ALLOWED_HOSTS: ${WIKI_MCP_ALLOWED_HOSTS}
      WIKI_MCP_ALLOWED_ORIGINS: ${WIKI_MCP_ALLOWED_ORIGINS}
      WIKI_MCP_DEFAULT_PROJECT_ID: ${WIKI_MCP_DEFAULT_PROJECT_ID:-}
      RAG_RETRIEVAL_VERSION: ${RAG_RETRIEVAL_VERSION:-v1}
      RAG_EMBEDDING_SERVICE_URL: ${RAG_EMBEDDING_SERVICE_URL:-http://rag-embedding-service:8080}
      RAG_RERANKER_SERVICE_URL: ${RAG_RERANKER_SERVICE_URL:-http://rag-reranker-service:8080}
      RAG_V2_EMBEDDING_MODEL: ${RAG_V2_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_V2_EMBEDDING_VERSION: ${RAG_V2_EMBEDDING_VERSION:-2026-07-21-bge-m3}
      RAG_V2_FALLBACK_TO_V1: ${RAG_V2_FALLBACK_TO_V1:-true}
      LOGGING_LEVEL: "INFO"
      SQLALCHEMY_LOG_LEVEL: "WARNING"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  smartbrain:
    image: smartbrain-dashboard-local:smartbrain-portable-2026-08-13
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3002:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0750

volumes:
  rag_model_cache:
    name: "agentops-rag-model-cache"
  material_uploads:
    name: "agentops-material-uploads"
