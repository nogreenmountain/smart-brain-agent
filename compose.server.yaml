services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USERNAME}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - "agentops_clickhouse_data:/var/lib/clickhouse"

  otelcollector:
    image: "agentops-otel-local:workday-ccswitch-2026-07-20"
    container_name: agentops-otel
    restart: unless-stopped
    depends_on:
      - clickhouse
    ports:
      - "4317:4317"
      - "4318:4318"
      - "127.0.0.1:13133:13133"
    environment:
      CLICKHOUSE_ENDPOINT: "http://clickhouse:8123"
      CLICKHOUSE_USERNAME: "${CLICKHOUSE_USERNAME}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE}"
      LOGS_TABLE_NAME: "otel_logs"
      TRACES_TABLE_NAME: "otel_traces"
      CLICKHOUSE_TTL: "720h"
      CLICKHOUSE_TIMEOUT: "10s"
      JWT_SECRET: "${JWT_SECRET_KEY}"

  api:
    image: "agentops-api-local:smartbrain-portable-2026-08-13"
    restart: unless-stopped
    depends_on:
      - clickhouse
    ports:
      - "8000:8000"
    networks:
      - default
      - supabase
    environment:
      PROTOCOL: "${PROTOCOL}"
      API_DOMAIN: "${API_DOMAIN}"
      APP_DOMAIN: "${APP_DOMAIN}"
      SUPABASE_URL: "http://supabase_kong_database:8000"
      SUPABASE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_HOST: "supabase_db_database"
      SUPABASE_PORT: "5432"
      SUPABASE_DATABASE: "postgres"
      SUPABASE_USER: "postgres"
      SUPABASE_PASSWORD: "postgres"
      SUPABASE_SSLMODE: "disable"
      SUPABASE_MAX_POOL_SIZE: "10"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      WORKDAY_COLLECTOR_ENDPOINT: "${WORKDAY_COLLECTOR_ENDPOINT}"
      WORKDAY_ENROLLMENT_TOKEN_DAYS: "30"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET}"
      AUTH_COOKIE_SECRET: "${AUTH_COOKIE_SECRET}"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: "${CLICKHOUSE_USERNAME}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE}"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_ENDPOINT: "http://clickhouse:8123"
      CLICKHOUSE_USERNAME: "${CLICKHOUSE_USERNAME}"
      LOGGING_LEVEL: "INFO"
      SQLALCHEMY_LOG_LEVEL: "WARNING"
      RATE_LIMIT_ENABLE: "false"

  dashboard:
    image: "agentops-dashboard-local:latest"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      SUPABASE_PROJECT_ID: "database"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_SIGNIN_METHODS: "${NEXT_PUBLIC_SIGNIN_METHODS}"
      NEXT_PUBLIC_ENVIRONMENT_TYPE: "${NEXT_PUBLIC_ENVIRONMENT_TYPE}"
      NEXT_PUBLIC_PLAYGROUND: "${NEXT_PUBLIC_PLAYGROUND}"

volumes:
  agentops_clickhouse_data:
    name: "agentops-clickhouse-data"

networks:
  supabase:
    external: true
    name: "supabase_network_database"
