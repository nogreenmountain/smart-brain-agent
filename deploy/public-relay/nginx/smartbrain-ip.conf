server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /relay-health {
        default_type text/plain;
        return 200 "smartbrain-relay-ok\n";
    }

    # Certbot 5.4+ uses this webroot to renew the short-lived public IP
    # certificate without stopping Nginx.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # The public root certificate is not secret. Serving it over HTTP gives a
    # new device a bootstrap path; users can verify the documented SHA-256
    # fingerprint before trusting it.
    location = /smartbrain-root-ca.crt {
        alias /etc/nginx/smartbrain-pki/root-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="smartbrain-root-ca.crt"';
    }

    location / {
        return 308 https://39.105.79.0$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/39.105.79.0/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.105.79.0/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SmartBrainTLS:10m;
    ssl_session_timeout 10m;

    location = /relay-health {
        default_type text/plain;
        return 200 "smartbrain-relay-ok\n";
    }

    location = /smartbrain-root-ca.crt {
        alias /etc/nginx/smartbrain-pki/root-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="smartbrain-root-ca.crt"';
    }

    # Keep browser traffic on the standard HTTPS port. This avoids depending
    # on cloud-provider firewall rules for the API, MCP and OTLP ports.
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location ^~ /v4/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18000/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:18010/mcp;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /v1/traces {
        proxy_pass http://127.0.0.1:14318/v1/traces;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /traces {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Both dashboards use Next.js assets below /_next. Try SmartBrain first
    # and fall back to the AgentOps dashboard when a trace-page asset hash is
    # not present in SmartBrain's build.
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:13002;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 404 = @agentops_assets;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @agentops_assets {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:13002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

